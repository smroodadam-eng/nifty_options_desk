name: Quant Desk CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Test Suite
        run: |
          pytest

      - name: Bundle Deployment Package
        run: |
          mkdir -p package
          pip install --target ./package -r requirements.txt
          cd package
          zip -r ../deployment.zip .
          cd ..
          zip -g deployment.zip -r src/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Upload to S3 and Deploy to Lambda
        run: |
          aws s3 cp deployment.zip s3://nifty-quant-desk-logs-2026/deployment.zip
          aws lambda update-function-code \
            --function-name nifty_options_engine \
            --s3-bucket nifty-quant-desk-logs-2026 \
            --s3-key deployment.zip \
            --region ap-south-1