name: Quant Desk CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # --- CI PHASE: Run Automated Tests ---
    - name: Run Test Suite
      run: |
        python -m pytest tests/

    # --- CD PHASE: Package & Deploy to AWS (Only on main branch) ---
    - name: Bundle Deployment Package
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        mkdir -p package/src
        pip install --target ./package -r requirements.txt
        cp -r src/* ./package/src/
        cd package
        zip -r ../quant_desk_package.zip .

    - name: Configure AWS Credentials
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Deploy to AWS Lambda
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        aws lambda update-function-code \
          --function-name nifty_options_engine \
          --zip-file fileb://quant_desk_package.zip